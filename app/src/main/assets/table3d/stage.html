 [s.bots[0],s.bots[1]].forEach(function(b,i){var P=person(b);var sd=i?1:-1;P.position.set(sd*6.3,1.0,-4.6);P.rotation.y=-sd*.3;P.scale.setScalar(1.4);root.add(P);people.push({g:P,y:.6,ph:1+i*1.7})});
 dirty=true;needCap=true;warm=8}
function size(){var w=window.innerWidth||document.documentElement.clientWidth||300,h=window.innerHeight||document.documentElement.clientHeight||300;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();dirty=true}
window.addEventListener('resize',size);size();
window.setStage=function(js){try{var s=typeof js==='string'?JSON.parse(js):js;var k=JSON.stringify(s);if(k===cur.k)return;cur.k=k;build(s)}catch(e){fail('build '+e)}};
var last=0;
function frame(now){requestAnimationFrame(frame);if(!cur.k)return;var t=(now-t0)/1000;
 if(motion){if(now-last<33)return;last=now;people.forEach(function(p){p.g.position.y=p.y+Math.sin(t*1.3+p.ph)*.035;p.g.rotation.z=Math.sin(t*.7+p.ph)*.012});camera.position.set(Math.sin(t*.25)*.35,CAMY,CAMZ);}
 else if(!dirty&&warm<=0)return;
 camera.position.y=CAMY;camera.position.z=CAMZ;camera.lookAt(0,CLY,CLZ);renderer.render(scene,camera);dirty=false;if(warm>0)warm--;checkDrawn();if(needCap&&okSent){needCap=false;capture()}}
function capture(){try{var d=renderer.domElement.toDataURL('image/jpeg',0.9);if(window.Android)Android.frame(d)}catch(e){fail('capture '+e)}}
function checkDrawn(){if(okSent)return;drawnFrames++;if(drawnFrames<3)return;
 try{var gl=renderer.getContext(),W=gl.drawingBufferWidth,H=gl.drawingBufferHeight,px=new Uint8Array(4),seen={},cnt=0;
  for(var i=1;i<8;i++)for(var j=1;j<8;j++){gl.readPixels(Math.floor(W*i/8),Math.floor(H*j/8),1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);var k=px[0]+','+px[1]+','+px[2];if(!seen[k]){seen[k]=1;cnt++}}
  if(cnt<4){if(drawnFrames>12){okSent=true;fail('blank canvas '+W+'x'+H+' colors '+cnt)}return}
  okSent=true;try{if(window.Android)Android.drawn()}catch(e){}
 }catch(e){okSent=true;fail('read '+e)}}
var CAMY=14,CAMZ=17,CLY=.4,CLZ=-4.8;
window.setCam=function(y,z,ly,lz,fov){CAMY=y;CAMZ=z;CLY=ly;CLZ=lz;if(fov){camera.fov=fov;camera.updateProjectionMatrix()}dirty=true};
requestAnimationFrame(frame);
try{if(window.Android)Android.ready()}catch(e){}
})();
